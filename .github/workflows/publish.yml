# Publishes to npm when main gets a version npm does not have yet. To release,
# raise "version" in package.json (and add a CHANGELOG entry), then push to main.
# A push that keeps the same version publishes nothing. Runs on GitHub through
# npm Trusted Publishing (set up once on npmjs.com for this repo and
# publish.yml), with provenance. There is no token to leak.

name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Only one publish can run at a time.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No pnpm cache: this job can publish, so it restores nothing another run saved.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      # A lookup that fails for another reason reads as "not published": the
      # publish then fails loudly, because npm never takes the same version twice.
      - name: Check whether this version is already on npm
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm. Raise the version in package.json to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $NAME@$VERSION."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify npm version supports Trusted Publishing
        if: steps.version.outputs.publish == 'true'
        run: |
          NPM_VERSION=$(npm --version)
          REQUIRED_VERSION="11.5.1"
          if [ "$(printf '%s\n' "$REQUIRED_VERSION" "$NPM_VERSION" | sort -V | head -n1)" != "$REQUIRED_VERSION" ]; then
            echo "Error: npm version $NPM_VERSION is too old. Need at least $REQUIRED_VERSION for Trusted Publishing."
            exit 1
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: steps.version.outputs.publish == 'true'
        run: pnpm test

      - name: Run build
        if: steps.version.outputs.publish == 'true'
        run: pnpm run build

      - name: Check the package contents
        if: steps.version.outputs.publish == 'true'
        run: bash scripts/check-pack.sh

      # Lint, build, then `npm publish` with provenance (n8n-node release in CI).
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: pnpm run release
